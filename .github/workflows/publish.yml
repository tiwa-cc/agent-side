name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Annotated release tag to publish (for example, v0.2.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag and package version
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          git rev-parse --verify "refs/tags/${RELEASE_REF}^{tag}" >/dev/null
          test "$(git rev-parse "refs/tags/${RELEASE_REF}^{}")" = "$(git rev-parse HEAD)"
          test "$RELEASE_REF" = "v$(node -p "require('./package.json').version")"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm pack --dry-run
      - run: npm publish
